<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions - ClearMint Ledger</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="brand">ClearMint Ledger</div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="transactions.html">Transactions</a>
      <a href="categories.html">Categories</a>
      <a href="reports.html">Reports</a>
      <a href="settings.html">Settings</a>
    </div>
  </nav>
  <div class="container">
    <div class="grid two">
      <form id="transaction-form" class="card">
        <div class="section-title"><h2>Add transaction</h2></div>
        <div class="grid two">
          <div>
            <label>Amount</label>
            <input type="number" name="amount" min="0.01" step="0.01" required>
          </div>
          <div>
            <label>Type</label>
            <select name="type" required>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>
          <div>
            <label>Category</label>
            <select name="category_id" data-category-select required></select>
          </div>
          <div>
            <label>Date</label>
            <input type="date" name="date" required>
          </div>
        </div>
        <div style="margin-top:8px;">
          <label>Description</label>
          <textarea name="description" rows="2" required></textarea>
        </div>
        <div style="margin-top:12px; text-align:right;">
          <button class="btn" type="submit">Add</button>
        </div>
      </form>

      <div class="card">
        <div class="section-title"><h2>Filters</h2></div>
        <form id="filters-form">
          <div class="filters">
            <select name="type">
              <option value="">All types</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
            <select name="categoryId" data-category-select>
              <option value="">All categories</option>
            </select>
            <input type="date" name="startDate" placeholder="Start date">
            <input type="date" name="endDate" placeholder="End date">
            <input type="text" id="search" name="search" placeholder="Search description">
            <select id="sort" name="sort">
              <option value="date">Sort by date</option>
              <option value="amount">Amount</option>
              <option value="type">Type</option>
              <option value="category">Category</option>
            </select>
          </div>
        </form>
      </div>
    </div>

    <div class="card table-wrapper">
      <div class="section-title"><h2>Transactions</h2></div>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="transactions-body"></tbody>
      </table>
    </div>
  </div>

  <div class="modal-backdrop">
    <div class="modal" id="edit-transaction-modal">
      <form id="edit-transaction-form">
        <h3>Edit transaction</h3>
        <div class="grid two">
          <div>
            <label>Amount</label>
            <input type="number" name="amount" min="0.01" step="0.01" required>
          </div>
          <div>
            <label>Type</label>
            <select name="type" required>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>
          <div>
            <label>Category</label>
            <select name="category_id" data-category-select required></select>
          </div>
          <div>
            <label>Date</label>
            <input type="date" name="date" required>
          </div>
        </div>
        <div style="margin-top:8px;">
          <label>Description</label>
          <textarea name="description" rows="2" required></textarea>
        </div>
        <div style="margin-top:12px; text-align:right;" class="flex" >
          <button type="button" class="btn secondary" onclick="closeModal('edit-transaction-modal')">Cancel</button>
          <button class="btn" type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
